known_deviations:
  all_mpnet_historical_semihard_excluded: artifacts/phase2_finetuning/all-mpnet-base-v2 contains 18 'semihard'
    runs with rank band [1, 25]; the canonical semihard_1_50 band is [1, 50]. Those 18 runs are excluded
    from v3 selection, preserved unmodified for provenance, and must never be reported as canonical semihard_1_50.
  historical_hard_top25_reused: hard_top25 arms were NOT rerun; they are reused unchanged from their existing
    artifacts. Their band [1, 25] is the DEFINITION of hard_top25, so they are canonical.
correction_effect_on_none_arm:
  note: best mean val_dev Recall@5 of the `none` arm, before vs after the encoded-string correction (22
    -> 132 strings per optimizer step)
  all-mpnet-base-v2:
    old: 0.817785
    corrected: 0.853212
    delta: 0.035427
  kamalkraj/BioSimCSE-BioLinkBERT-BASE:
    old: 0.795229
    corrected: 0.839395
    delta: 0.044166
  NeuML/pubmedbert-base-embeddings:
    old: 0.807156
    corrected: 0.836561
    delta: 0.029405
  conclusion: The correction materially improves the no-explicit-negative baseline (+0.029 to +0.044 Recall@5),
    so the previous comparison overstated the benefit of hard negatives by roughly that much. Even corrected,
    `none` remains 0.048-0.060 Recall@5 below the best negative-mining arm for every model, so the qualitative
    conclusion is unchanged and now rests on an equal encoder budget per optimizer step.
