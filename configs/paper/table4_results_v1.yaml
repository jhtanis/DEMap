schema_version: 1
contract_id: table4_v1
title: DEMap manuscript Table 4 results contract
scope: >-
  Recompute the published Table 4 metrics from frozen query-level outputs.
  This contract does not describe model training or neural inference.

metric:
  id: recall_at_5
  cutoff: 5
  definition: >-
    A query is a hit when at least one accepted gold CDE public identifier
    occurs among the first five returned public identifiers.
  multi_gold_semantics: any accepted gold public identifier is a hit
  query_denominator: reachable evaluation queries only
  unreachable_gold_queries_excluded: true
  primary_authority: exact integer hit count and exact query denominator
  rendering:
    decimal_places: 3
    rounding: ROUND_HALF_UP

total_queries: 7349

methods:
  - id: final_reranker
    display_name: Final reranker
    maximum_depth: 30
    ranking_policy: score_desc_numeric_public_id_asc_v1
    depth_description: complete final candidate pool
  - id: python_cde_match_approx
    display_name: Python approximation
    maximum_depth: 10
    ranking_policy: archived_rank_asc_v1
    depth_description: archived top 10; deeper ranks are not fabricated
  - id: bm25
    display_name: BM25
    maximum_depth: 100
    ranking_policy: archived_rank_asc_v1
    depth_description: archived top 100
  - id: ft_mpnet
    display_name: FT-MPNet
    maximum_depth: 100
    ranking_policy: archived_rank_asc_v1
    depth_description: archived top 100
  - id: cde_match_fuzzy
    display_name: CDE Match-Fuzzy
    maximum_depth: 100
    ranking_policy: archived_rank_asc_v1
    depth_description: archived top 100
  - id: ft_medcpt
    display_name: FT-MedCPT pooled rerank
    maximum_depth: 30
    ranking_policy: archived_rank_asc_v1
    depth_description: complete pooled-candidate ranking

