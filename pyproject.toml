[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "DEMap"
version = "1.0.0"
description = "DEMap: code and reproducibility workflows for the reported CDE-mapping analyses — benchmark construction, bi-encoder and cross-encoder training, lexical retrieval, and the final HGBC reranker."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "HHS/NIH collaborators" }]
keywords = ["caDSR", "common data elements", "information retrieval", "biomedical NLP"]
classifiers = ["License :: OSI Approved :: MIT License"]

# Pinned to the versions the paper environment actually ran (Python 3.10.8).
# Lower bounds are the tested versions; upper bounds guard the majors that
# changed public APIs we depend on.
dependencies = [
  "pandas==2.3.3",
  "numpy==2.2.6",
  "scipy==1.15.3",
  "scikit-learn==1.7.2",
  "pyarrow==24.0.0",
  "pyyaml==6.0.3",
  "tqdm==4.67.3",
  "joblib>=1.2",
  # Used by the CDE Match-Fuzzy retriever for its Unicode-property patterns;
  # the stdlib re module does not support them.
  "regex==2026.4.4",
]

[project.optional-dependencies]
# Neural stages: bi-encoder screening/fine-tuning and cross-encoder training.
# Not required to run the lexical baselines, the feature/reranker parity tests,
# or any reporting stage that consumes precomputed artifacts.
neural = [
  "torch==2.11.0",
  "transformers==5.6.2",
  "sentence-transformers==5.4.1",
  "accelerate==1.13.0",
  "datasets==4.8.4",
  "huggingface_hub==1.11.0",
  "safetensors==0.7.0",
]
# Figure and table generation.
figures = ["matplotlib==3.10.8"]
# caDSR XML extraction.
extract = ["lxml==6.1.0"]
# Excel readers. The CIMAC evaluation set is built from the public NCI
# CIMAC-CIDC Appendix A workbook, which pandas reads through openpyxl.
excel = ["openpyxl==3.1.5"]
# Word/PowerPoint readers. Two modules import these at module level:
# reporting/schematics/_reference_figure6.py (pptx) and
# sensitivity/allowance/validate.py (docx). Unlike every other pin in this file
# these were never installed in the paper environment, so no version can honestly
# be claimed to have run; the bounds are minimums, not reproductions.
documents = [
  "python-pptx>=0.6.21",
  "python-docx>=1.1.0",
]
dev = ["pytest==9.0.3"]
all = [
  "DEMap[neural]",
  "DEMap[figures]",
  "DEMap[extract]",
  "DEMap[excel]",
  "DEMap[documents]",
  "DEMap[dev]",
]

[project.scripts]
# Console script. The import package stays demap_repro; renaming it would
# break every module path and every recorded provenance entry for no gain.
demap = "demap_repro.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
demap_repro = ["py.typed"]
