    notes: "A Stage-2 CONDITIONAL RERANKING ablation: every condition scores the identical fixed Stage-1 candidate pool (423,395 rows, row-multiset identical) and no candidate is removed, so it measures contribution to ranking within the pool, NOT candidate generation - that is S5.6 / Table S5. The HGBC is retrained from scratch on val_train for each condition (never a rescore) with the shipped hyperparameters FROZEN via train-hgbc --fixed-config, so the feature set is the only design change; the full condition reproduces the shipped model byte-identically. G4 (PV overlap) and G5 (text characteristics) sit in the lexical family by TYPE OF EVIDENCE, not provenance: they are computed for every pooled candidate from the public catalog and are not CDE Match-Fuzzy outputs, which is why the family is named 'Lexical/keyword-oriented evidence' and must not be renamed after the retriever. Read absolute values from broad_family_recall{5,1}_display.csv (single-rounded); re-rounding the 4-dp absolute/delta files double-rounds. DO NOT attribute small deltas to candidate-pool ceiling proximity: the ceiling bounds improvement, not deterioration. Arm-level effects are conservative because arm membership is partly inferable by negation (corr(in_biencoder_topk, in_keyword_topk) = -0.862). GDC is n=72, so one query is 0.014 Recall@5; do not interpret per-dataset GDC deltas. The fine-grained nine-condition companion (v25 Figure S7) is retired and deliberately not migrated."

