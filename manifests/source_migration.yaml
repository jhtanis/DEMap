  nci_cde_match_source:
    description: NCI-supplied Oracle PL/SQL and the CDE Match logic PDF, delivered for internal use.
    status: unresolved
    affects_stages:
    - C
    - D
    - E
    - F
    - G
    - H2
    decision_needed: Written NCI determination on redistribution of the supplied source material.
    dimension: code_redistributable
    blocks_reproducible_by_retraining: false
    dimension_note: Redistribution of the SUPPLIED source only. Never publishable by us; not a retraining
      question.
    copy_policy: NEVER copy into DST. Read from immutable SRC only, if ever needed for parity.
  cde_match_derivative_unresolved:
    description: Python approximation to NCI CDE Match (cde_match_clone.py) and the CDE Match-Fuzzy keyword
      retriever built on it. Both are derivative works of the supplied PL/SQL, and CDE Match-Fuzzy is
      one of the two candidate sources for the final system.
    status: unresolved
    affects_stages:
    - C
    - D
    - E
    - F
    - G
    - H2
    decision_needed: Whether the Python derivative may be published. If not, stages D-H consume released
      precomputed candidate/pool artifacts instead.
    dimension: code_redistributable
    blocks_reproducible_by_retraining: false
    dimension_note: Redistribution of OUR derivative implementation. The method has no learned parameters,
      so 'reproducible_by_retraining' is not_applicable; downstream stages can instead consume a user-supplied
      or precomputed candidate artifact.
    copy_policy: Do not copy into DST until cleared.
  cde_match_derived_artifacts:
    description: Candidate/result parquets produced by the clone and by CDE Match-Fuzzy, and the official
      NCI CDE Match service outputs.
    status: unresolved
    affects_stages:
    - C
    - D
    - E
    - F
    - G
    - H1
    - H2
    decision_needed: Whether derived outputs may be released even if the implementation may not.
    dimension: data_redistributable
    blocks_reproducible_by_retraining: false
    dimension_note: 'Redistribution of the candidate/result parquets. Independent of whether the implementation
      may be published: releasing the artifacts alone would keep every downstream stage runnable in precomputed
      mode.'
    copy_policy: Do not copy into DST until cleared.
  official_nci_cde_match_frozen:
    description: Saved output of the live NCI CDE Match production service (GDC and CIMAC only).
    status: unresolved
    affects_stages:
    - G
    decision_needed: Whether the saved service output may be redistributed.
    dimension: externally_frozen_result
    blocks_reproducible_by_retraining: true
    dimension_note: Saved output of a live third-party service. Never a runnable public experiment under
      any resolution; it is a frozen input, not a gate on our code.
    copy_policy: Never runnable publicly; treat as frozen externally supplied numbers.
  cimac_unresolved:
    description: CIMAC-CIDC Appendix A source workbook and every CIMAC-derived evaluation artifact.
    status: unresolved
    affects_stages:
    - A
    - B5a
    - G
    - H1
    decision_needed: Whether CIMAC raw or derived (n=131 query/gold) data may be published.
    dimension: data_redistributable
    blocks_reproducible_by_retraining: false
    dimension_note: Distinguish raw workbook redistribution from processed n=131 evaluation-set redistribution.
      A user holding the workbook locally can run the CIMAC stages regardless of the decision.
    copy_policy: Do not copy into DST until cleared.
  cadsr_snapshot_unresolved:
    description: caDSR nightly XML exports of 2026-01-12 (benchmark construction) and 2026-06-18 (production
      catalog). These are nightly exports, not archived public releases.
    status: unresolved
    affects_stages:
    - A
    decision_needed: Whether the snapshots or the derived splits/catalog may be published. Byte-exact
      re-acquisition by an external user is impossible either way.
    dimension: data_redistributable
    blocks_reproducible_by_retraining: false
    dimension_note: Distinguish snapshot redistribution from derived split/catalog redistribution. Neither
      blocks the code; both bound how much of Level 3 an external user can execute.
    copy_policy: Do not copy into DST until cleared.
  finetuned_weights_unresolved:
    description: FT-MPNet, FT-BioSimCSE and FT-PubMedBERT Phase 2 checkpoints.
    status: unresolved
    affects_stages:
    - B3
