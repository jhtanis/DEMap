    dimension: weights_redistributable
    blocks_reproducible_by_retraining: false
    dimension_note: 'Redistribution of OUR fine-tuned bi-encoder checkpoints. Does NOT imply the result
      is irreproducible: the base checkpoints are public HF models and the training protocol is documented,
      so reproducible_by_retraining is yes.'
    copy_policy: Do not copy into DST; destined for Zenodo if cleared.
  medcpt_derivative_weights_unresolved:
    description: FT-MedCPT cross-encoder checkpoint (and FT-BGE / FT-MiniLM comparison checkpoints).
