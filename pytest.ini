[pytest]
testpaths = tests
python_files = test_*.py
addopts = -ra --strict-markers
# Run the suite straight from a clone, without `pip install -e .` first.
pythonpath = src

markers =
    tier1: structural invariants of paper artifacts — fast, no model execution
    tier2: behavioural tests of migrated implementations against small fixtures
    tier3: full regression/parity against the authoritative paper artifacts
    parity: asserts a published number or artifact is reproduced
    needs_artifacts: requires the frozen experiment artifacts (not distributed)
    needs_gated: requires material whose redistribution status is unresolved
    needs_neural: requires the [neural] extra (torch / transformers)
    slow: minutes rather than seconds
